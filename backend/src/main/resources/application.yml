server:
  port: 8888
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: muzhou-report
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
      # optional: 前缀保证脚本缺失时不影响启动
      data-locations:
        - classpath:db/mz_dataset.sql
        - classpath:db/mz_dataset_field.sql
        - classpath:db/mz_dataset_param.sql
        - classpath:db/mz_datasource.sql
        - classpath:db/mz_param.sql
        - classpath:db/mz_report.sql
        - classpath:db/order_items.sql
        - classpath:db/order_shipments.sql
        - classpath:db/orders.sql
      continue-on-error: true
  datasource:
    dynamic:
      primary: master
      strict: false
      # 换掉某个数据源的连接信息时，老池等它上面的连接跑完再关（异步），
      # 而不是当场 close 把别人正在跑的查询掐断
      grace-destroy: true
      # 注意：这一段只管下面显式列出的 master（本系统自己的元数据库）。
      # 「数据源管理」里加出来的业务库走的是 muzhou.report.pool，两边分开配，见那一节的注释
      hikari:
        connection-timeout: 30000
        max-lifetime: 1800000
        maximum-pool-size: 10
        minimum-idle: 2
      datasource:
        master:
          driver-class-name: org.h2.Driver
          url: jdbc:h2:file:./data/muzhoureport;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
          username: sa
          password: ''

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.muzhou.report.entity
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumOrdinalTypeHandler
  global-config:
    banner: false
    db-config:
      id-type: assign_uuid
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

muzhou:
  report:
    # 单个数据集最大返回行数，防止 OOM。sql 用 setMaxRows，api/json 解析行数组时截断（都记 warn）
    max-rows: 20000
    # api 型数据集单次响应的字节上限，超过报错。行数上限是解析之后才生效的，
    # 不在读流的时候掐断，一个还几百 MB 的接口就是一次 OOM
    api-max-bytes: 33554432
    # 同时进行的导出任务数（Excel/PDF/Word 共用）。导出全程在内存里，max-cells 只拦得住单次规模；
    # 排队比 OOM 之后整个服务倒下强
    export-concurrency: 4
    # 排队等导出名额的最长秒数，等不到就报错让用户重试
    export-wait-seconds: 60
    # 数据集预览默认条数
    preview-rows: 100
    # SQL 执行超时(秒)
    query-timeout: 30
    # 渲染后最大单元格数
    max-cells: 500000
    # 父子关联（子接口查询）里主表最多驱动多少行子查询 —— 主表每行都要打一次子表的 SQL/接口
    max-link-rows: 500
    # 一次渲染里并行取数的并发度（<=1 为串行）。多个数据集的 SQL/接口互相独立，并行取省的是纯 IO 等待；
    # 线程池全应用共用一个、空闲即回收。并发压力落在业务库连接池与下游接口上，调大前先确认扛得住。
    # 配了父子关联的报表不受此项影响（关联取数有先后依赖，先主后子）
    fetch-parallelism: 4
    # 业务库连接池：在「数据源管理」里加出来的每个数据源（MySQL / PostgreSQL / Oracle / SQLServer / H2）
    # 各建一个 HikariCP 池，**参数全部取自这里、所有业务库共用一份**（实现见 DynamicDatasourceRegistry）。
    # 池是定长的：查询从池里借连接、用完还回去，借不到就排队等 connection-timeout，不会再往库上开新连接。
    # 这一份不含 master（本系统自己的元数据库），它的池在 spring.datasource.dynamic.hikari
    pool:
      # 单个业务库的最大连接数。**每个数据源各占一份**，10 个数据源就是最多 10×这个数，
      # 调大前先确认对方库的 max_connections 扛得住。一次渲染可能并行打几个数据集
      # （fetch-parallelism），导出还有 export-concurrency，这两项越大越吃连接
      maximum-pool-size: 10
      # 常驻的空闲连接数。1 = 免掉每次渲染重新握手+登录这一下，又不至于十来个数据源白占几十条；
      # 0 = 完全空闲时一条不留；等于 maximum-pool-size = 真正的定长池（此时 idle-timeout 不起作用）
      minimum-idle: 1
      # 等一条空闲连接的最长毫秒数，等不到就报错（池满时排队等的就是它）
      connection-timeout: 30000
      # 借出前做存活校验的超时（毫秒），必须小于 connection-timeout
      validation-timeout: 5000
      # 空闲连接多久后回收（毫秒），0 = 不回收。高峰期涨上去的连接靠它退回 minimum-idle
      idle-timeout: 600000
      # 一条连接的最长寿命（毫秒），0 = 不限。**要小于数据库那边的空闲断连时间**
      # （MySQL 的 wait_timeout、云上负载均衡常砍到几分钟），否则偶发 Communications link failure
      max-lifetime: 1800000
      # 空闲连接的保活间隔（毫秒），0 = 关闭；开启时不得小于 30000。被防火墙按空闲时长掐连接时才需要
      keepalive-time: 0
      # 连接借出超过多少毫秒未归还就打一条疑似泄漏的日志（带调用栈），0 = 关闭；开启时不得小于 2000
      leak-detection-threshold: 0
      # 存活校验 SQL，**留空 = 走 JDBC4 的 Connection.isValid()**，各家数据库通吃，推荐留空。
      # 别统一填 SELECT 1：Oracle 上那是语法错（要 SELECT 1 FROM DUAL），而这份配置是所有业务库共用的
      connection-test-query: ''
    # 打开一张不存在的报表时是否当场建一张空白的（为「外部系统拿业务 KEY 直接开设计器」准备）。
    # 代价是 GET /api/report/{id} 带上了写副作用，不靠这个能力的部署应当关掉。
    # 只对设计器打开那条路生效，渲染/导出一律不建。
    auto-create: true
    # 接口请求/返回日志（调试用），实现见 config/RequestLogFilter
    log:
      # 关掉则一条不打
      enabled: true
      # 是否带请求体与响应体；关掉只打「方法 路径 状态码 耗时」一行
      body: true
      # 请求体/响应体单边最多打多少字符（渲染结果动辄几百 KB，全打控制台就没法看了）
      max-body: 2000
      # 只记这些路径
      include:
        - /api/**
      # 这些路径不打响应体（请求体照打）：响应是几 MB 的二进制，缓存下来白占内存也打不出东西
      exclude:
        - /api/render/**/export/**
      # 这些路径请求体与响应体都不打，只留一行摘要：请求体里带着业务库口令
      mask:
        - /api/datasource/**
    # PDF 导出：后端先出 xlsx 再用 OpenPDF 逐格画成 pdf，纯 Java，不依赖 LibreOffice / MS Office
    pdf:
      # 正文字体文件，留空则自动探测系统中文字体（Windows 雅黑/宋体、Linux 文泉驿/Noto、macOS 苹方）。
      # PDF 必须内嵌字体才能显示中文；服务器上一个中文字体都没有时中文会显示不出来，
      # 此时装个中文字体（如 fonts-wqy-zenhei）或在这里指到具体字体文件。
      # .ttc 字体集用「路径,序号」指定其中一款，例：C:/Windows/Fonts/msyh.ttc,0
      font-path: ''
    # 上传字体（「字体管理」页）：服务器上没有的字体传一份上来，PDF 才印得出它。
    # 画布靠 @font-face、xlsx/docx 里只写得进字体名，唯独 PDF 必须把字体文件本身内嵌进去。
    # 字体文件的正本存在库里（mz_font.file_data），所以多节点部署时在哪个节点传都一样，
    # 不需要共享存储 —— 前提是各节点连同一个库（默认那个内嵌 H2 是单节点的，多节点要切 MySQL）
    font:
      # 字体文件的**本地缓存目录**（PDF 引擎要的是一个路径，不是一段字节）：
      # 各节点第一次用到某款字体时从库里落一份到这儿。删了不会丢东西，下次用到自动重新落
      dir: ./data/fonts
      # 单个字体文件的字节上限（30MB）。中文字体动辄十几 MB，照图片那个 5MB 收不下
      max-bytes: 31457280
    # 图片单元格（type=img / base64）导出时取图的配置。
    # 只影响导出：预览时图片是浏览器自己去拉的，服务端不碰 —— 所以内网地址要**服务器**也能访问
    image:
      # 下载一张图片的连接/读取超时(毫秒)
      timeout: 5000
      # 相对路径图片（/upload/a.png）所在的站点，例：http://10.0.0.9:8080
      # 前端拼上当前站点就能显示，服务端没有「当前页面」这个上下文，不配就只能跳过
      base-url: ''
      # 单张图片的字节数上限，超过就跳过这一张（导出不中断）。
      # 图片是随数据行扩展出来的，500 行就是 500 张，不设上限一个指错的地址就能把内存吃光
      max-bytes: 5242880

logging:
  level:
    com.muzhou.report: debug
    com.baomidou.dynamic: warn
